name: Foto diaria · macro Colombia + mundo

# Deja frontend/data/macro-co.json actualizado en el repo.
# El frontend lo lee de su MISMO origen: sin proxy, sin llaves, sin CORS.
# (El proxy público que se usaba desde el navegador devolvió 522 en
#  producción — un tercero gratuito no puede estar en el camino crítico.)

on:
  schedule:
    # 11:20 UTC ≈ 06:20 en Colombia, después de que el Banrep publica la TRM.
    - cron: '20 11 * * *'
  workflow_dispatch:        # botón manual en la pestaña Actions

permissions:
  contents: write
  pages: write        # necesario para pedir el despliegue a mano (ver abajo)

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer indicadores de Colombia
        run: node scripts/fetch-macro.mjs

      - name: Traer tasas de credito y tope de usura
        run: node scripts/fetch-credit.mjs
        continue-on-error: true

      - name: Traer mercados y prensa financiera
        run: node scripts/fetch-world.mjs
        continue-on-error: true   # si el mundo falla, la foto de Colombia igual se commitea

      - name: Commitear si cambió
        run: |
          if [[ -z $(git status --porcelain frontend/data/) ]]; then
            echo "Sin cambios — no se commitea."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/
          git commit -m "chore(12-FIN): foto diaria de datos $(date -u +%Y-%m-%d)"
          git push
          echo "PUSHED=1" >> $GITHUB_ENV

      # ── Sin este paso, el dato se actualiza en el repo y NUNCA llega al sitio ──
      # GitHub no dispara workflows (incluido pages-build-deployment) con los push
      # hechos usando GITHUB_TOKEN: es una protección anti-recursión documentada.
      # Resultado observado el 2026-08-12: la Action commiteó a las 12:02 UTC y
      # cuatro horas después el sitio seguía sirviendo la foto del día anterior.
      # Se pide el build de Pages explícitamente por la API.
      - name: Pedir el despliegue de GitHub Pages
        if: env.PUSHED == '1'
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "POST /pages/builds -> HTTP $code"
          cat /tmp/pages.json
          if [ "$code" != "201" ]; then
            echo "::warning::Pages no aceptó la petición de build (HTTP $code)."
            echo "::warning::Si persiste: Settings > Pages > Source = GitHub Actions, o revisá que Pages esté activo."
          fi
