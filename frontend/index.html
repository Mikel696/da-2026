<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerebro</title>
<meta name="description" content="El Cerebro de Miguel: sus módulos de estudio, trabajo, inglés, música y finanzas con los datos al día y el pulso de Colombia.">
<meta name="theme-color" content="#060A12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23060A12'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%235CE1FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- La fuente no bloquea el primer pintado: mientras llega se ve system-ui. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@90..125,400..900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/inicio.css?v=4">
</head>
<body>
<div class="cielo" aria-hidden="true"><i></i></div>
<header class="barra">
  <span class="marca"><span class="pulsar"></span><b>Cerebro</b></span>
  <button class="buscar" id="abrirPaleta" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="largo">Buscar o ir a cualquier módulo</span><span class="corto">Buscar</span><kbd>Ctrl K</kbd></button>
  <span class="hora" id="hora"></span>
  <button class="avatar" id="avatar" popovertarget="cuenta" aria-label="Tu cuenta, la sincronización y el respaldo"><span class="ini" id="ini">·</span></button>
</header>
<div id="cuenta" popover></div>

<main>
  <section class="cab">
    <div><h1 id="hola">Hola.</h1><p class="fecha" id="fecha"></p></div>
    <div class="hud entra" style="--i:2" id="hud"></div>
  </section>

  <section class="bento" id="bento" aria-label="Tus módulos principales"></section>
  <section class="vid mas entra" style="--i:9" id="mas" aria-label="Más módulos"></section>

  <section class="sec">
    <div class="vid panel entra" style="--i:10">
      <h2>Pulso de Colombia <small id="pulsoFecha"></small></h2>
      <p class="sub">Datos oficiales con su fecha y su ventana, de la foto diaria de 12-FIN.</p>
      <div class="pulso" id="pulso"><p class="vacio">Leyendo los datos…</p></div>
      <button class="ofertas-btn" popovertarget="ofertas">Ofertas y eventos <small id="ofertasN"></small></button>
    </div>
  </section>
</main>

<!-- Rail: abre cada módulo aquí mismo, en el iframe (router Cerebro en js/inicio.js) -->
<nav class="rail" id="rail" aria-label="Módulos">
  <button class="rail-inicio" id="railInicio" aria-label="Inicio"><i></i></button>
  <div id="railMods" style="display:contents"></div>
</nav>
<iframe id="stageFrame" title="Módulo del Cerebro" src="about:blank"></iframe>
<div class="frame-load" role="status">Cargando módulo…</div>

<dialog id="detalle" aria-label="Detalle del módulo"></dialog>
<div id="ofertas" popover>
  <header><h2>Ofertas y eventos</h2><button popovertarget="ofertas" popovertargetaction="hide">Cerrar</button></header>
  <div class="cuerpo" id="ofertasCuerpo"><p class="vacio">Leyendo el directorio…</p></div>
</div>
<dialog id="paleta" aria-label="Buscar o ir a un módulo">
  <input id="q" type="search" placeholder="Escribe un módulo, un código (SYS, 12) o un tema" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="resultados" aria-label="Buscar módulo">
  <ul id="resultados" role="listbox" aria-label="Resultados"></ul>
  <p class="pie">Flechas para moverte, Enter para abrir, Esc para cerrar.</p>
</dialog>

<!-- La portada pinta primero con lo que hay en este navegador; la sesión y la sincronización llegan después. -->
<script src="js/inicio.js?v=5"></script>
<!-- Auth chain: must load on every page so session persists platform-wide.
     defer: mismo orden, corre antes de DOMContentLoaded (cuando arranca auth.js) y no frena el primer pintado. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="js/supabase-client.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/cloud-sync.js?v=p26"></script>
</body>
</html>
